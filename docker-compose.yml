services:
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ai-task-platform
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=devsecret
      - NODE_ENV=development
    depends_on:
      - mongodb
      - redis

  worker:
    build: ./worker
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ai-task-platform
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo-data:
