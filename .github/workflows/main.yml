name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-backend:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/ai-backend:latest

    - name: Build and push Worker
      uses: docker/build-push-action@v4
      with:
        context: ./worker
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-worker:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/ai-worker:latest

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-frontend:${{ github.sha }}, ${{ secrets.DOCKERHUB_USERNAME }}/ai-frontend:latest

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        repository: <USER_OR_ORG>/infra-repo # Replace with your infra repo
        token: ${{ secrets.GH_PAT }}

    - name: Update image tags
      run: |
        sed -i 's|image: .*/ai-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-backend:${{ github.sha }}|' k8s/backend.yaml
        sed -i 's|image: .*/ai-worker:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-worker:${{ github.sha }}|' k8s/worker.yaml
        sed -i 's|image: .*/ai-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ai-frontend:${{ github.sha }}|' k8s/frontend.yaml
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .
        git commit -m "Update image tags to ${{ github.sha }}"
        git push
